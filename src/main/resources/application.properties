spring.application.name=elearning

# Database (Render provides DATABASE_URL automatically)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret (must be set as environment variable)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Server port (Render injects PORT)
server.port=${PORT:8080}

# Gmail SMTP (set MAIL_USERNAME and MAIL_PASSWORD as environment variables)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

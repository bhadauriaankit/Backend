# Server
server.port=${SERVER_PORT:8080}

# Database. Defaults to local H2; set SPRING_DATASOURCE_* for PostgreSQL/prod.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:elearningdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:dev-only-elearning-secret-change-before-production}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Email
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true  
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.mail.from=${APP_MAIL_FROM:${spring.mail.username:no-reply@localhost}}
app.seed-sample-users=${APP_SEED_SAMPLE_USERS:false}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Scheduling
spring.task.scheduling.pool.size=2

# Logging
logging.level.com.ankit.elearning=INFO
logging.level.org.springframework.security=WARN

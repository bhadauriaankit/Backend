spring.application.name=elearning

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/elearning
spring.datasource.username=bhadauria_ankit
spring.datasource.password=Pass1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Use 'update' to preserve data across server restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=mySecretKeyForJWTTokenGeneration2026SecureAndLongEnough!
jwt.expiration=86400000

# Server
server.port=8080

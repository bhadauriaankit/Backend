spring.application.name=elearning

# Database
# Database Configuration using individual environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Remove the line 'spring.jpa.properties.hibernate.dialect=...' - it's auto-detected.

# JWT
jwt.secret=mySecretKeyForJWTTokenGeneration2026SecureAndLongEnough!
jwt.expiration=86400000

# Server
server.port=8080

